<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Experimental Dashboards - Showcase</title>
    <link
      rel="shortcut icon"
      type="image/png"
      href="./resources/icons8-favicon.gif"
    />
    <link rel="stylesheet" href="./app/app.css" />
    <script type="module" src="./app/app.js"></script>
  </head>
  <body>
    <div class="showcase-layout">
      <!-- Top header bar -->
      <header class="showcase-header">
        <div class="showcase-brand">
          <img src="./resources/icons8-favicon.gif" alt="Logo" />
          <h1>Experimental Dashboards</h1>
          <span class="showcase-badge">v1.0.0</span>
        </div>
        <div class="showcase-actions">
          <a
            href="https://github.com/rochejul/experimental-dashboards"
            target="_blank"
            rel="noopener noreferrer"
            class="github-link"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
              />
            </svg>
            GitHub Repository
          </a>
        </div>
      </header>

      <!-- Main workspace -->
      <main class="showcase-main">
        <!-- Sidebar demo picker -->
        <aside class="showcase-sidebar">
          <div>
            <div class="sidebar-section-title">Available Experiments</div>
            <ul class="demo-nav-list">
              <li>
                <button
                  type="button"
                  class="demo-nav-item active"
                  data-demo="css-anchoring"
                >
                  <div class="demo-nav-title">
                    <span>CSS Anchor Positioning</span>
                    <span class="showcase-badge">API</span>
                  </div>
                  <p class="demo-nav-desc">
                    Connected nodes with orthogonal CSS gradient lines and Anchor Positioning API.
                  </p>
                </button>
              </li>
            </ul>
          </div>

          <div>
            <div class="sidebar-section-title">About this Monorepo</div>
            <p style="font-size: 0.8rem; color: var(--color-text-muted); line-height: 1.4;">
              A sandbox repository exploring next-generation CSS specifications, layout techniques, and modern frontend capabilities.
            </p>
          </div>
        </aside>

        <!-- Stage / Viewport -->
        <section class="showcase-stage">
          <div class="stage-toolbar">
            <div class="toolbar-tabs">
              <button
                type="button"
                class="toolbar-tab-btn active"
                data-view="static"
              >
                Static Topology
              </button>
              <button
                type="button"
                class="toolbar-tab-btn"
                data-view="dynamic"
              >
                Dynamic Draggable
              </button>
            </div>

            <div class="toolbar-controls">
              <button
                type="button"
                class="toolbar-icon-btn"
                id="btn-responsive-desktop"
                title="Desktop View"
              >
                💻 Desktop
              </button>
              <button
                type="button"
                class="toolbar-icon-btn"
                id="btn-responsive-tablet"
                title="Tablet View"
              >
                📱 Tablet
              </button>
              <button
                type="button"
                class="toolbar-icon-btn"
                id="btn-responsive-mobile"
                title="Mobile View"
              >
                📱 Mobile
              </button>
              <button
                type="button"
                class="toolbar-icon-btn"
                id="btn-reload"
                title="Reload View"
              >
                🔄
              </button>
              <button
                type="button"
                class="toolbar-icon-btn"
                id="btn-open-direct"
                title="Open directly in new tab"
              >
                ↗️ Open
              </button>
            </div>
          </div>

          <div class="stage-viewport-container">
            <iframe
              id="stage-frame"
              class="stage-iframe responsive-desktop"
              src="./demos/css-anchoring/static.html"
              title="Dashboard Demo"
            ></iframe>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
