<!doctype html>
<html lang="en" class="app">
  <head>
    <link
      rel="shortcut icon"
      type="image/png"
      href="./resources/icons8-favicon.gif"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard with anchor positioning api</title>
    <link rel="stylesheet" href="./app/app.css" />
    <script type="module" src="./app/app.js"></script>
  </head>

  <body class="app">
    <div class="app__body grid">
      <details name="alpha" style="--n: 1" open="open">
        <summary>Static version</summary>
        <iframe
          class="app__body__iframe"
          src="./app/static/index.html"
          name="static"
          loading="eager"
        ></iframe>
      </details>
      <details name="alpha" style="--n: 2">
        <summary>Configurable version</summary>
        <iframe
          class="app__body__iframe"
          src="./app/configurable/index.html"
          name="configurable"
          loading="lazy"
        ></iframe>
      </details>
      <details name="alpha" style="--n: 3">
        <summary>Dynamic version</summary>
        <iframe
          class="app__body__iframe"
          src="./app/dynamic/index.html"
          name="dynamic"
          loading="lazy"
        ></iframe>
      </details>
      <details name="alpha" style="--n: 4">
        <summary>Dynamic and automatic version</summary>
        <iframe
          class="app__body__iframe"
          src="./app/position-fallbacks/index.html"
          name="position-fallbacks"
          loading="lazy"
        ></iframe>
      </details>
    </div>
  </body>
</html>
